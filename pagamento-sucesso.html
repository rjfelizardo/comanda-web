<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagamento aprovado — Comanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF3E7;
    --paper: #FFFFFF;
    --ink: #3B2416;
    --muted: #8A7A6B;
    --hair: #EBDFCF;
    --accent: #C97C3D;
    --ok: #6B8E5A;
    --ok-bg: #E9F0E4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: 'Inter', sans-serif; display: flex; align-items: center;
    justify-content: center; padding: 24px;
  }
  .brand-serif { font-family: 'Fraunces', serif; }
  .card {
    background: var(--paper); border: 1px solid var(--hair); border-radius: 20px;
    padding: 36px 28px; max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 10px 24px rgba(59,36,22,.08);
  }
  .icon {
    width: 64px; height: 64px; border-radius: 50%; background: var(--ok-bg);
    color: var(--ok); font-size: 30px; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 18px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
  a.btn {
    display: block; background: var(--accent); color: #fff; text-decoration: none;
    padding: 13px; border-radius: 999px; font-weight: 700; font-size: 13.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1 class="brand-serif">Pagamento aprovado!</h1>
    <p>Recebemos a confirmação do seu pagamento. Seu pedido já entra na fila de preparo — em breve você recebe novidades por WhatsApp.</p>
    <a class="btn" href="https://wa.me/5571920074764">Voltar pro WhatsApp</a>
  </div>
</body>
</html>
